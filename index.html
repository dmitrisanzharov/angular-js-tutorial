<!DOCTYPE html>
<html lang="en" ng-app="MyAngularAppMainModule" ng-controller="MyAngularAppMainController" ng-cloak>
    <head>
        <title>My NG App</title>

        <!-- Angular Material style sheet -->
        <link rel="stylesheet" href="/app/lib/material/angular-material.min.css" />

        <!-- general CSS -->
        <link href="/app/styles/generalCss.css" rel="stylesheet" type="text/css" />

        <!-- ANGULAR CDN -->
        <script src="app/lib/angular.min.js"></script>
        <script src="app/lib/angular-route.min.js"></script>

        <!-- YES, NEEDED-->
        <script src="app/lib/angular-animate.min.js"></script>
        <script src="app/lib/angular-aria.min.js"></script>
        <script src="app/lib/angular-messages.min.js"></script>

        <!-- Angular Material CDN -->
        <script src="app/lib/material/angular-material.min.js"></script>

        <!-- APP JS -->
        <script src="app/app.js" type="module"></script>
    </head>
    <body>
        <button ng-click="seeScope()">see scope</button>
        <hr />

        <div layout-padding>
            <md-input-container>
                <label for="myAuto">Autocomplete demo</label>
                <md-autocomplete
                    id="myAuto"
                    md-items="item in myArr | filter:autoCompleteInput"
                    md-min-length="0"
                    md-item-text="(item.id).toString()"
                    md-selected-item="selectedItemObject"
                    md-search-text="autoCompleteInput"
                >
                    <md-item-template>
                        <span>{{item.name}}</span>
                    </md-item-template>
                    <md-not-found>nothing found</md-not-found>
                   
                </md-autocomplete>
            </md-input-container>
            <h1>{{selectedItemObject}}</h1>
             <!-- <h2 style="margin-top: 200px">{{(myArr | filter:autoCompleteInput).length}}</h2> -->
        </div>
    </body>
</html>
