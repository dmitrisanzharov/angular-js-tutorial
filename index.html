<!DOCTYPE html>
<html lang="en" ng-app="angularMainWrapper">
	<head>
		<title>My NG App</title>
		<!-- css stuff -->
		<link href="content/css/styles.css" rel="stylesheet" type="text/css" />

		<!-- ANGULAR CDN -->
		<script src="app/lib/angular.min.js"></script>
		<script src="app/lib/angular-route.min.js"></script>

		<!-- APP JS -->
		<script src="app/app.js" type="module"></script>
	</head>
	<body>
		<h1>Start</h1>
	</body>
	<div ng-controller="mainController">
		<h1>{{mainTitle}}</h1>
		<div ng-init="myStr='visible'">invisible {{myStr}}</div>
		<div>{{superObj}}</div>
		<div ng-bind-html="myFn()"></div>
		<div>{{(myArr | filter: '2').length}}</div>
		<input type="checkbox" ng-model="myCheckboxVar" />
	</div>
</html>
