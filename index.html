<!DOCTYPE html>
<html lang="en" ng-app="MyAngularAppMainModule" ng-controller="MyAngularAppController" ng-cloak>
    <head>
        <title>My NG App</title>

        <!-- Angular Material style sheet -->
        <link rel="stylesheet" href="/app/lib/material/angular-material.min.css" />

        <!-- general CSS -->
        <link href="/app/styles/generalCss.css" rel="stylesheet" type="text/css" />

        <!-- ANGULAR CDN -->
        <script src="app/lib/angular.min.js"></script>
        <script src="app/lib/angular-route.min.js"></script>

        <!-- NOT sure if needed -->
        <script src="app/lib/angular-animate.min.js"></script>
        <script src="app/lib/angular-aria.min.js"></script>
        <script src="app/lib/angular-messages.min.js"></script>

        <!-- Angular Material CDN -->
        <script src="app/lib/material/angular-material.min.js"></script>

        <!-- APP JS -->
        <script src="app/app.js" type="module"></script>
    </head>
    <body layout="column">
        <md-toolbar layout-align="center center">
            <h1>My heading</h1>
        </md-toolbar>
        <div layout="row" flex>
            <md-sidenav md-is-locked-open="true" style="background-color: yellowgreen" flex layout-padding>
                <h2>My Side Nav Content</h2>
            </md-sidenav>
            <md-content style="background-color: lightblue" flex layout-padding>
                <h2>My content stuff</h2>
                <md-divider></md-divider>
                <div style="background-color: white" md-whiteframe="{{myVarOne}}">omg omg</div>
                <md-list layout="row">
                    <md-list-item ng-repeat="item in myArr" style="border: 1px solid red">{{item}}</md-list-item>
                </md-list>
                <md-button class="md-raised md-primary">this is my button</md-button>
                <md-divider></md-divider>
                <md-subheader>my subheader</md-subheader>
                <md-icon></md-icon>
            </md-content>
        </div>
        <md-bottom-sheet style="background-color: pink">
            <h3>my bottom sheet</h3>
        </md-bottom-sheet>
    </body>
</html>
