<!doctype html>
<html lang="en" ng-app="MyAngularAppMainModule" ng-controller="MyAngularAppController" ng-cloak>
    <head>
        <title>My NG App</title>

        <!-- Angular Material style sheet -->
        <link rel="stylesheet" href="/app/lib/material/angular-material.min.css" />

        <!-- general CSS -->
        <link href="/app/styles/generalCss.css" rel="stylesheet" type="text/css" />

        <!-- ANGULAR CDN -->
        <script src="app/lib/angular.min.js"></script>
        <script src="app/lib/angular-route.min.js"></script>

        <!-- NOT sure if needed -->
        <script src="app/lib/angular-animate.min.js"></script>
        <script src="app/lib/angular-aria.min.js"></script>
        <script src="app/lib/angular-messages.min.js"></script>

        <!-- Angular Material CDN -->
        <script src="app/lib/material/angular-material.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-flex-layout/1.1.1/angular-flex-layout.min.js"></script>

        <!-- APP JS -->
        <script src="app/app.js" type="module"></script>
    </head>
    <body>
        <div style="padding: 10px">
            <button ng-click="showScope()" style="margin-bottom: 20px">Show Scope</button>
            <md-input-container>
                <label for="myAutoComplete">Search for an item</label>
                <md-autocomplete
                id="myAutoComplete"
                    md-items="item in myArr | filter: nameOfSearchInput"
                    md-min-length="0"
                    md-item-text="item.id.toString()"
                    md-selected-item="theSelectedOne"
                    md-search-text="nameOfSearchInput"
                >
                    <md-item-template> {{item}} </md-item-template>
                    <md-not-found> No matches found. </md-not-found>
                </md-autocomplete>
            </md-input-container>

            <hr />
            <div ng-if="theSelectedOne.name">{{theSelectedOne}}</div>

            <div>{{(myArr | filter: nameOfSearchInput).length}}</div>
        </div>
    </body>
</html>
