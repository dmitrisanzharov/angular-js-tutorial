<!DOCTYPE html>
<html lang="en" ng-app="MyAngularAppMainModule" ng-controller="MyAngularAppController" ng-cloak>
    <head>
        <title>My NG App</title>

        <!-- Angular Material style sheet -->
        <link rel="stylesheet" href="/app/lib/material/angular-material.min.css" />

        <!-- general CSS -->
        <link href="/app/styles/generalCss.css" rel="stylesheet" type="text/css" />

        <!-- ANGULAR CDN -->
        <script src="app/lib/angular.min.js"></script>
        <script src="app/lib/angular-route.min.js"></script>

        <!-- NOT sure if needed -->
        <script src="app/lib/angular-animate.min.js"></script>
        <script src="app/lib/angular-aria.min.js"></script>
        <script src="app/lib/angular-messages.min.js"></script>

        <!-- Angular Material CDN -->
        <script src="app/lib/material/angular-material.min.js"></script>

        <!-- data grid -->
        <script src="app/lib/data-grid/pagination.min.js"></script>
        <script src="app/lib/data-grid/dataGrid.min.js"></script>

        <!-- APP JS -->
        <script src="app/app.js" type="module"></script>
    </head>
    <body ng-controller="TestController">
        <button ng-click="showScopeTest()">see scope</button>
        <hr />

        <div grid-data grid-options="gridOptions" grid-actions="gridActions" style="height: 400px">
            <h1>Header for Grid</h1>
            <input type="text" placeholder="this is SEARCH" ng-change="gridActions.filter()" ng-model="findName" filter-by="findName" />

            <hr />
            <input type="text" placeholder="this is SEARCH second" ng-change="gridActions.filter()" ng-model="filterLast" filter-by="filterLast" filter-type="text" />
            <hr />
            <table>
                <thead>
                    <tr>
                        <th style="border: 1px solid red; padding: 10px" sortable="code" class="sortable">ID</th>
                        <th style="border: 1px solid red; padding: 10px" sortable="code" class="sortable">Name</th>
                        <th style="border: 1px solid red; padding: 10px" sortable="code" class="sortable">Second</th>
                    </tr>
                </thead>
                <tbody>
                    <tr grid-item>
                        <td>{{item.id}}</td>
                        <td>{{item.first_name}}</td>
                        <td>{{item.last_name}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
