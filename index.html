<!DOCTYPE html>
<html lang="en" ng-app="MyAngularAppMainModule" ng-controller="MyAngularAppController" ng-cloak>
	<head>
		<title>My NG App</title>

		<!-- Angular Material style sheet -->
		<link rel="stylesheet" href="/app/lib/material/angular-material.min.css" />

		<!-- general CSS -->
		<link href="/app/styles/generalCss.css" rel="stylesheet" type="text/css" />

		<!-- ANGULAR CDN -->
		<script src="app/lib/angular.min.js"></script>
		<script src="app/lib/angular-route.min.js"></script>

		<!-- NOT sure if needed -->
		<script src="app/lib/angular-animate.min.js"></script>
		<script src="app/lib/angular-aria.min.js"></script>
		<script src="app/lib/angular-messages.min.js"></script>

		<!-- Angular Material CDN -->
		<script src="app/lib/material/angular-material.min.js"></script>

		<!-- data grid -->
		<script src="app/lib/data-grid/pagination.min.js"></script>
		<script src="app/lib/data-grid/dataGrid.min.js"></script>

		<!-- APP JS -->
		<script src="app/app.js" type="module"></script>
	</head>
	<body ng-controller="MyMainController">
		<h1>Test</h1>
		<input 
			type="text" 
			placeholder="search by text"
			ng-change="gridActions.filter()"
			ng-model="myFilterOne"
			filter-by="myFilterOne"
			filter-type="text"
		/>
		<button ng-click="showScope()">Show Scope</button>
        <div grid-data grid-options="gridOptions" grid-actions="gridActions">
            <table>
                <thead>
                    <tr>
                        <th sortable="code">First Name <span>{{gridOptions.grid.sortOptions.direction}}; </span></th>
                        <th sortable="code">Last Name <span>{{gridOptions.grid.sortOptions.direction}}; </span></th>
                        <th sortable="code">ID <span>{{gridOptions.grid.sortOptions.direction}}; </span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr grid-item>
                        <td>{{ item.first_name }}</td>
                        <td>{{ item.last_name }}</td>
                        <td>{{ item.id }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

	</body>
</html>
