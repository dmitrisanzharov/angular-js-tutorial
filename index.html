    <style>
        input.ng-touched,
        textarea.ng-invalid.ng-touched {
            border: 2px solid red;
        }
    </style>

    <body ng-controller="MyMainController">
        <form name="myNgForm" ng-submit="submitNgForm()">
            <div>
                <label for="name">Name</label>
                <input
                    type="text"
                    name="nameOfInput"
                    placeholder="enter name"
                    ng-model="nameOfInputModel.nameInput2"
                    required
                />
            </div>
            <div ng-show="myNgForm.nameOfInput.$dirty" style="color: red;">omg dirty</div>
            <button type="submit" ng-disabled="myNgForm.$invalid">submit</button>
        </form>
