<!DOCTYPE html>
<html lang="en" ng-app="myAngularMainModule" ng-controller="MyMainController" ng-clock>
	<head>
		<title>My NG App</title>
        <link href="css/styles.css" rel="stylesheet" type="text/css" />
        
		<!-- ANGULAR CDN -->
		<script src="app/lib/angular.min.js"></script>
		<script src="app/lib/angular-route.min.js"></script>

		<!-- APP JS -->
		<script src="app/app.js"></script>
	</head>
	<body >

		<div ng-init="fooVarInit=1; myString1='yayaya'">{{fooVarInit}}</div>

		<button ng-click="seeScope()">see scope, {{myString1}}</button>
		<br />

		<hr />
		<!-- all other goes here -->

		<ul>
			<li ng-repeat="item in myArr" ng-show="$even">{{item}} and index is: {{$index}} and is first: {{$first}} and last is: {{$last}}</li>
		</ul>

		<ul>
			<li ng-repeat="item in myObj2">{{item.name}} - {{item.foo}}</li>
		</ul>

		<hr />

		<div ng-init="myArr=[1,2,3]">{{myArr}}</div>
		<button ng-click="changeArr()">change arr</button>

		<hr />

		<input type="text" ng-model="myInputOne" />
		{{myInputOne}}


		<hr />

		<div style="border: 1px solid red">
			<h1>{{parentTitle}}</h1>

			<div ng-controller="MySecondController" style="border: 1px solid blue">
				<!-- its same as: {{$scope.childTitle}} -->
				{{childTitle}}
				<!-- its same as: {{$parent.parentTitle}} -->
				<h1>{{parentTitle}}</h1>
			</div>
		</div>


	
	</body>
</html>
